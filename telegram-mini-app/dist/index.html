<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="JARVIS AI" />
    <meta name="description" content="JARVIS AI — Your Personal AI Trading Assistant" />
    <title>JARVIS AI</title>
    <style>
      body {
        margin: 0; background: #0a0e1a; color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
      }
      #root { min-height: 100vh; min-height: 100dvh; }
      .splash{position:fixed;inset:0;background:#0a0e1a;display:flex;align-items:center;justify-content:center;z-index:99999;transition:opacity .3s}
      .splash-logo{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:pulse 1.5s ease infinite}
      @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}
      #jarvis-error-overlay{display:none;position:fixed;inset:0;background:#0a0e1a;z-index:999999;padding:20px;overflow-y:auto;font-family:monospace}
      #jarvis-error-overlay.show{display:block}
      #jarvis-error-overlay h2{color:#ef4444;font-size:18px;margin:0 0 12px}
      #jarvis-error-overlay .err-msg{background:#1e293b;color:#fbbf24;padding:12px;border-radius:8px;font-size:13px;word-break:break-all;margin:8px 0;max-height:200px;overflow-y:auto}
      #jarvis-error-overlay .err-info{color:#94a3b8;font-size:12px;margin:4px 0}
      #jarvis-error-overlay button{background:#3b82f6;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;margin-top:12px;cursor:pointer}
    </style>
    <!-- GLOBAL ERROR CATCHER — Must be BEFORE any module scripts -->
    <script>
      (function(){
        var errors = [];
        var overlay = null;
        function showError(msg, source, line, col, err) {
          errors.push({msg:msg, source:source, line:line, col:col, stack:err&&err.stack});
          if (!overlay) {
            overlay = document.getElementById('jarvis-error-overlay');
          }
          if (overlay) {
            overlay.className = 'show';
            var html = '<h2>⚠️ JARVIS Debug — JS Error Detected</h2>';
            html += '<p class="err-info">Errors: ' + errors.length + ' | Time: ' + new Date().toLocaleTimeString() + '</p>';
            html += '<p class="err-info">Location: ' + (window.location.href) + '</p>';
            html += '<p class="err-info">UserAgent: ' + navigator.userAgent.substring(0,120) + '</p>';
            for (var i = 0; i < errors.length; i++) {
              var e = errors[i];
              html += '<div class="err-msg">';
              html += '<b>Error ' + (i+1) + ':</b> ' + (e.msg||'Unknown') + '<br>';
              if (e.source) html += '<b>File:</b> ' + e.source + '<br>';
              if (e.line) html += '<b>Line:</b> ' + e.line + ':' + (e.col||0) + '<br>';
              if (e.stack) html += '<b>Stack:</b><br>' + e.stack.replace(/\n/g,'<br>');
              html += '</div>';
            }
            html += '<button onclick="location.reload()">🔄 Reload App</button>';
            html += ' <button onclick="document.getElementById(\'jarvis-error-overlay\').className=\'\'">✕ Dismiss</button>';
            overlay.innerHTML = html;
          }
        }
        window.onerror = function(msg, source, line, col, err) {
          showError(msg, source, line, col, err);
          return false;
        };
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          showError(
            'Unhandled Promise: ' + (reason && reason.message || reason || 'unknown'),
            reason && reason.fileName || '',
            reason && reason.lineNumber || 0,
            0,
            reason
          );
        });
        // Also detect if React root stays empty after 8 seconds
        window.addEventListener('load', function() {
          setTimeout(function() {
            var root = document.getElementById('root');
            if (root && root.innerHTML.trim() === '') {
              showError('React app did not render after 8 seconds. Root element is empty.', 'index.html', 0, 0, null);
            }
          }, 8000);
        });
        window.__jarvisShowError = showError;
      })();
    </script>

    <link rel="modulepreload" crossorigin href="/assets/vendor-react-DwoDrinR.js">

    <link rel="stylesheet" crossorigin href="/assets/index-Bt7M8uHt.css">
  </head>
  <body>
    <div id="jarvis-error-overlay"></div>
    <div id="splash" class="splash"><div class="splash-logo">JARVIS</div></div>
    <div id="root"></div>
    <script>
      // Remove splash after app loads (only if root has content)
      window.addEventListener('load', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          var s = document.getElementById('splash');
          if (s && root && root.innerHTML.trim() !== '') {
            s.style.opacity = '0';
            setTimeout(function() { s.remove(); }, 300);
          }
        }, 1200);
      });
      // Unregister any stale service workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(r) { r.unregister(); });
        });
      }
    </script>
  </body>
</html>
