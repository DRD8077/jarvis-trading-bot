<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JARVIS" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="JARVIS Trading" />
    <meta name="description" content="AI-Powered Trading Intelligence — Crypto, Stocks, Options, DeFi" />
    <meta name="msapplication-TileColor" content="#0a0e1a" />
    <link rel="manifest" href="/miniapp/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/miniapp/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/miniapp/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/miniapp/icons/icon-512.png" />
    <title>JARVIS Trading</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      body {
        margin: 0; background: #0a0e1a; color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
      }
      #root { min-height: 100vh; min-height: 100dvh; }
      /* Splash loader */
      .splash{position:fixed;inset:0;background:#0a0e1a;display:flex;align-items:center;justify-content:center;z-index:99999;transition:opacity .3s}
      .splash-logo{font-size:2rem;font-weight:800;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:pulse 1.5s ease infinite}
      @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}
    </style>
  </head>
  <body>
    <div id="splash" class="splash"><div class="splash-logo">JARVIS</div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/miniapp/sw.js', { scope: '/miniapp' })
            .then(reg => { console.log('SW registered:', reg.scope); reg.update(); })
            .catch(err => console.log('SW failed:', err));
        });
      }
      // Remove splash after app loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          const s = document.getElementById('splash');
          if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 300); }
        }, 800);
      });
    </script>
  </body>
</html>
