services:
  - type: web
    name: jarvis-trading-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    envVars:
      - key: PORT
        value: "8000"
      - key: DOMAIN
        value: davidcrewai.shop
      - key: WEBAPP_URL
        value: https://davidcrewai.shop/miniapp
