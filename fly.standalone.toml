# ═══════════════════════════════════════════════════════════
#  JARVIS AI Trading Platform — Fly.io Standalone Deployment
# ═══════════════════════════════════════════════════════════
app = "jarvis-ai-platform"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile.standalone"

[env]
  PORT = "8000"
  APP_MODE = "standalone"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

  [[services.http_checks]]
    interval = 30000
    grace_period = "10s"
    method = "get"
    path = "/health"
    protocol = "http"
    timeout = 5000

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
