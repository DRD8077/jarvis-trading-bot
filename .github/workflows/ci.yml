# ═══════════════════════════════════════════════════════════════
#  JARVIS Trading Platform — CI Pipeline (SDLC Phase: Build+Test)
#  Triggers: push to main, PRs to main
# ═══════════════════════════════════════════════════════════════
name: CI — Lint, Test & Build

on:
  push:
    branches: [main, develop]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ═══ Python Backend — Lint + Test ═══
  backend-check:
    name: 🐍 Backend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff

      - name: Ruff lint (fast Python linter)
        run: ruff check . --output-format=github || true

      - name: Run Python tests
        env:
          ADMIN_CHAT_ID: "123456"
          OWNER_CHAT_ID: "123456"
          TELEGRAM_BOT_TOKEN: "test:token"
        run: |
          pytest tests/ -v --tb=short --co -q 2>&1 | head -50
          pytest tests/ -v --tb=short --timeout=30 || true

      - name: Import smoke test (all modules)
        env:
          ADMIN_CHAT_ID: "123456"
          OWNER_CHAT_ID: "123456"
        run: |
          python -c "
          import importlib, sys
          modules = [
            'jarvis_server', 'jarvis_error_handler', 'jarvis_redis_cache',
            'jarvis_rate_limiter', 'jarvis_prometheus', 'jarvis_tasks',
            'jarvis_database', 'jarvis_notifications', 'jarvis_social',
            'jarvis_backtester_pro', 'jarvis_dextools', 'jarvis_birdeye',
          ]
          failed = []
          for m in modules:
              try:
                  importlib.import_module(m)
                  print(f'  ✅ {m}')
              except Exception as e:
                  failed.append(m)
                  print(f'  ❌ {m}: {e}')
          if failed:
              print(f'\n⚠️ {len(failed)} modules failed to import')
              sys.exit(1)
          print(f'\n✅ All {len(modules)} modules imported successfully')
          "

  # ═══ Frontend — Lint + Build ═══
  frontend-check:
    name: ⚛️ Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-mini-app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: telegram-mini-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: telegram-mini-app/dist/
          retention-days: 7

  # ═══ Docker Build Check ═══
  docker-check:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: jarvis-trading:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ═══ Security Scan ═══
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        run: |
          echo "🔍 Scanning for hardcoded secrets..."
          FOUND=0
          # Check for common secret patterns
          grep -rn "sk-[a-zA-Z0-9]\{20,\}" --include="*.py" --include="*.js" --include="*.jsx" . || true
          grep -rn "ghp_[a-zA-Z0-9]\{36\}" --include="*.py" --include="*.js" . || true
          # Check env example has no real values
          if [ -f .env ]; then
            echo "⚠️ .env exists — ensure it's in .gitignore"
            grep -q ".env" .gitignore && echo "  ✅ .env is in .gitignore" || echo "  ❌ .env NOT in .gitignore!"
          fi
          echo "✅ Secret scan complete"
