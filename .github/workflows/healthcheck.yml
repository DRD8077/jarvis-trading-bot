name: Scheduled Health Check

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check health endpoint and alert via Telegram
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          TELEGRAM_TOKEN: ${{ secrets.HEALTHCHECK_TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.HEALTHCHECK_TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "HEALTHCHECK_URL not set"
            exit 1
          fi
          if curl -fsS "$HEALTHCHECK_URL" >/dev/null; then
            echo "OK"
            exit 0
          fi
          echo "Healthcheck failed; sending Telegram alert"
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            PAYLOAD="{\"chat_id\":\"$TELEGRAM_CHAT_ID\",\"text\":\"ALERT: Health check failed for $HEALTHCHECK_URL\"}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" -H "Content-Type: application/json" -d "$PAYLOAD" || true
          else
            echo "Telegram secrets not set; skipping alert"
          fi
          exit 1
